<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>form.track</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="logo">form<span>.</span>track</div>
      <p class="login-sub">Suivi de poids &amp; mensurations</p>
      <button id="googleLoginBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
        Continuer avec Google
      </button>
      <p class="login-note">Chaque compte est strictement privé</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="logo">form<span>.</span>track</div>
      <div class="user-area">
        <img id="userAvatar" src="" alt="" class="avatar" />
        <span id="userName" class="user-name"></span>
        <button id="logoutBtn" class="icon-btn" title="Déconnexion"><i class="ti ti-logout"></i></button>
      </div>
    </header>

    <!-- TABS -->
    <nav class="tabs">
      <button class="tab active" data-tab="poids">
        <i class="ti ti-scale"></i><span>Poids</span>
      </button>
      <button class="tab" data-tab="mensur">
        <i class="ti ti-ruler-measure"></i><span>Mensurations</span>
      </button>
    </nav>

    <!-- POIDS -->
    <section id="tabPoids" class="tab-content active">
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label">Poids actuel</div>
          <div class="kpi-val" id="kpiCurrent">—</div>
        </div>
        <div class="kpi kpi-clickable" title="Cliquer pour modifier l'objectif">
          <div class="kpi-label">Objectif <i class="ti ti-pencil" style="font-size:10px;opacity:.5"></i></div>
          <div class="kpi-val" id="kpiGoal">—</div>
          <input type="number" id="goalInput" class="goal-input hidden" step="0.1" min="30" max="200" placeholder="kg" />
        </div>
        <div class="kpi">
          <div class="kpi-label">Perdu au total</div>
          <div class="kpi-val" id="kpiLost">—</div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">ÉVOLUTION — 12 DERNIERS MOIS</div>
          <div id="chartCurrentVal" class="chart-now"></div>
        </div>
        <div class="chart-wrap">
          <canvas id="weightChart" role="img" aria-label="Courbe de poids sur 12 mois"></canvas>
        </div>
      </div>

      <button class="add-btn" id="addWeightBtn">
        <i class="ti ti-plus"></i> Enregistrer une pesée
      </button>
    </section>

    <!-- MENSURATIONS -->
    <section id="tabMensur" class="tab-content hidden">
      <div id="mensurNoData" class="no-data hidden">
        <i class="ti ti-ruler-measure"></i>
        <p>Aucune mensuration enregistrée</p>
        <button class="add-btn" id="addMensurBtnEmpty"><i class="ti ti-plus"></i> Première prise</button>
      </div>

      <div id="mensurData">
        <div class="mensur-topbar">
          <div id="dateNav" class="date-nav"></div>
          <div id="mensurSummary" class="mensur-summary"></div>
        </div>

        <div class="measures-card">
          <div class="m-head">
            <span>Zone</span>
            <span>Actuel</span>
            <span>Depuis début</span>
          </div>
          <div id="measureRows"></div>
        </div>
      </div>

      <button class="add-btn" id="addMensurBtn">
        <i class="ti ti-plus"></i> Nouvelle prise de mensurations
      </button>
    </section>

  </div>

  <!-- MODAL PESÉE -->
  <div id="modalWeight" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">Nouvelle pesée</div>
      <label class="field-label">Date</label>
      <input type="date" id="weightDate" class="field-input" />
      <label class="field-label">Poids (kg)</label>
      <input type="number" id="weightVal" class="field-input" step="0.1" min="30" max="300" placeholder="ex: 82.5" />
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelWeightBtn">Annuler</button>
        <button class="btn-confirm" id="confirmWeightBtn">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- MODAL MENSURATIONS -->
  <div id="modalMensur" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">Nouvelle prise de mensurations</div>
      <label class="field-label">Date</label>
      <input type="date" id="mensurDate" class="field-input" />
      <div class="mensur-fields" id="mensurFields"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelMensurBtn">Annuler</button>
        <button class="btn-confirm" id="confirmMensurBtn">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <!-- FIREBASE -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
